<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="CV Copilot — a live A4 résumé editor. The page-count pill flips from green '1 page' to red '2 pages' the moment the CV overflows.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0866FF"/>
      <stop offset="1" stop-color="#3b8bff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0b1a3a" flood-opacity="0.10"/>
    </filter>
    <clipPath id="win"><rect x="452" y="70" width="784" height="316" rx="16"/></clipPath>
    <style>
      @keyframes pillGreen {
        0%,30% { opacity:1 } 34%,66% { opacity:0 } 70%,100% { opacity:1 }
      }
      @keyframes pillRed {
        0%,31% { opacity:0; transform:translateX(0) }
        34% { opacity:1; transform:translateX(0) }
        37% { transform:translateX(-4px) }
        40% { transform:translateX(4px) }
        43% { transform:translateX(-3px) }
        46% { transform:translateX(0) }
        64% { opacity:1; transform:translateX(0) }
        68%,100% { opacity:0; transform:translateX(0) }
      }
      @keyframes page2 {
        0%,30% { opacity:0; transform:translateX(26px) }
        36%,64% { opacity:1; transform:translateX(0) }
        70%,100% { opacity:0; transform:translateX(26px) }
      }
      @keyframes overflowLine {
        0%,30% { transform:scaleX(0); opacity:0 }
        35%,64% { transform:scaleX(1); opacity:1 }
        69%,100% { transform:scaleX(0); opacity:0 }
      }
      @keyframes hintPulse {
        0%,32% { opacity:0 } 40%,60% { opacity:1 } 68%,100% { opacity:0 }
      }
      @keyframes caret { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      /* base state = clean "1 page" green, so non-animating renderers show that */
      .pg { opacity:1; animation: pillGreen 7s ease-in-out infinite }
      .pr { opacity:0; animation: pillRed 7s ease-in-out infinite; transform-box: fill-box; transform-origin:center }
      .p2 { opacity:0; animation: page2 7s ease-in-out infinite; transform-box: fill-box }
      .ol { opacity:0; animation: overflowLine 7s ease-in-out infinite; transform-box: fill-box; transform-origin:left center }
      .hint { opacity:0; animation: hintPulse 7s ease-in-out infinite }
      .car { animation: caret 1.1s steps(1) infinite }
      text { font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif }
    </style>
  </defs>

  <!-- backdrop card (reads on GitHub light + dark) -->
  <rect x="1" y="1" width="1278" height="438" rx="26" fill="url(#card)" stroke="#e4e8ef" stroke-width="1.5"/>
  <rect x="1" y="1" width="1278" height="7" rx="3.5" fill="url(#accentbar)"/>

  <!-- ── left panel: wordmark + pitch ─────────────────────────── -->
  <!-- page mark -->
  <g transform="translate(52,60)">
    <rect x="0" y="0" width="34" height="42" rx="5" fill="#0866FF"/>
    <path d="M23 0 H34 V11 Z" fill="#0a4fc0"/>
    <rect x="7" y="12" width="16" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="7" y="20" width="20" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="7" y="28" width="13" height="3" rx="1.5" fill="#ffffff" opacity="0.75"/>
  </g>
  <text x="98" y="80" font-size="40" font-weight="800" fill="#0f1729" letter-spacing="-1">CV Copilot</text>
  <text x="99" y="106" font-size="15" font-weight="600" fill="#5b6472" letter-spacing="0.2">Your AI-native résumé copilot.</text>

  <text x="52" y="168" font-size="21" font-weight="700" fill="#1f2733">One page.</text>
  <text x="150" y="168" font-size="21" font-weight="700" fill="#0866FF">Or the build fails.</text>
  <text x="52" y="198" font-size="15" fill="#5b6472">Drop your old PDF — Claude maps it in.</text>
  <text x="52" y="220" font-size="15" fill="#5b6472">Tailor to the job. Score it. Ship it.</text>

  <!-- feature chips -->
  <g font-size="13" font-weight="600">
    <g transform="translate(52,250)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#eef4ff" stroke="#d3e2ff"/>
      <text x="52" y="20" text-anchor="middle" fill="#0b57d0">AI import</text>
    </g>
    <g transform="translate(166,250)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#eef4ff" stroke="#d3e2ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#0b57d0">Tailor + ATS</text>
    </g>
    <g transform="translate(52,290)">
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#eef4ff" stroke="#d3e2ff"/>
      <text x="60" y="20" text-anchor="middle" fill="#0b57d0">Cover letters</text>
    </g>
    <g transform="translate(182,290)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#eef4ff" stroke="#d3e2ff"/>
      <text x="52" y="20" text-anchor="middle" fill="#0b57d0">BYO key</text>
    </g>
  </g>

  <!-- loehrning tie -->
  <g transform="translate(52,372)">
    <rect x="0" y="2" width="7" height="7" fill="#B73A15"/>
    <rect x="11" y="2" width="7" height="7" fill="#B73A15"/>
    <text x="26" y="10" font-size="13" font-weight="600" fill="#8a929e">by loehrning.ai · open source · MIT</text>
  </g>

  <!-- ── right panel: mini editor window ──────────────────────── -->
  <g filter="url(#soft)">
    <rect x="452" y="70" width="784" height="316" rx="16" fill="#ffffff" stroke="#e4e8ef"/>
  </g>
  <g clip-path="url(#win)">
    <!-- top bar -->
    <rect x="452" y="70" width="784" height="46" fill="#fbfcfe"/>
    <line x1="452" y1="116" x2="1236" y2="116" stroke="#eef1f6"/>
    <circle cx="478" cy="93" r="5" fill="#ff5f57"/>
    <circle cx="497" cy="93" r="5" fill="#febc2e"/>
    <circle cx="516" cy="93" r="5" fill="#28c840"/>
    <rect x="548" y="82" width="70" height="22" rx="6" fill="#0866FF"/>
    <text x="583" y="97" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Save</text>
    <rect x="626" y="82" width="88" height="22" rx="6" fill="#eef1f6" stroke="#e0e5ec"/>
    <text x="670" y="97" font-size="12" font-weight="600" fill="#3a4453" text-anchor="middle">Build PDF</text>

    <!-- page-count pill (green ↔ red) -->
    <g class="pg">
      <rect x="1092" y="80" width="120" height="26" rx="13" fill="#e7f8ee" stroke="#8fdcae"/>
      <circle cx="1110" cy="93" r="4.5" fill="#22a95b"/>
      <path d="M1108 93 l1.6 1.7 l3-3.3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
      <text x="1124" y="97" font-size="13" font-weight="700" fill="#177d43">1 page</text>
    </g>
    <g class="pr">
      <rect x="1054" y="80" width="166" height="26" rx="13" fill="#fdeceb" stroke="#f3b0ac"/>
      <circle cx="1072" cy="93" r="6" fill="#e0473e"/>
      <rect x="1071" y="89.4" width="2" height="4.2" rx="1" fill="#fff"/>
      <rect x="1071" y="95.2" width="2" height="2" rx="1" fill="#fff"/>
      <text x="1086" y="97" font-size="12.5" font-weight="700" fill="#c0362f">Overflow · 2 pages</text>
    </g>

    <!-- form column -->
    <g>
      <text x="476" y="140" font-size="10.5" font-weight="700" fill="#8a929e" letter-spacing="1">EXPERIENCE</text>
      <!-- 3 field rows -->
      <g>
        <rect x="476" y="150" width="70" height="7" rx="3.5" fill="#c7cdd6"/>
        <rect x="476" y="162" width="360" height="26" rx="7" fill="#f4f6fa" stroke="#e6eaf1"/>
        <text x="486" y="179" font-size="12" fill="#3a4453">Senior Data Engineer<tspan class="car" fill="#0866FF"> |</tspan></text>
      </g>
      <g>
        <rect x="476" y="200" width="54" height="7" rx="3.5" fill="#c7cdd6"/>
        <rect x="476" y="212" width="360" height="26" rx="7" fill="#f4f6fa" stroke="#e6eaf1"/>
        <text x="486" y="229" font-size="12" fill="#3a4453">Nordhelm Systems · Berlin</text>
      </g>
      <g>
        <rect x="476" y="250" width="44" height="7" rx="3.5" fill="#c7cdd6"/>
        <rect x="476" y="262" width="360" height="58" rx="7" fill="#f4f6fa" stroke="#e6eaf1"/>
        <rect x="486" y="274" width="330" height="6" rx="3" fill="#cfd5de"/>
        <rect x="486" y="286" width="300" height="6" rx="3" fill="#cfd5de"/>
        <rect x="486" y="298" width="250" height="6" rx="3" fill="#cfd5de"/>
      </g>
      <!-- add-bullet button -->
      <rect x="476" y="332" width="128" height="26" rx="7" fill="#eef4ff" stroke="#d3e2ff"/>
      <text x="540" y="349" font-size="12" font-weight="600" fill="#0b57d0" text-anchor="middle">+ Add bullet</text>
      <text x="626" y="349" class="hint" font-size="11.5" font-weight="600" fill="#c0362f">↑ this one tipped page 2</text>
    </g>

    <!-- divider -->
    <line x1="868" y1="124" x2="868" y2="386" stroke="#eef1f6"/>

    <!-- preview: page 1 -->
    <g>
      <rect x="900" y="132" width="150" height="212" rx="4" fill="#ffffff" stroke="#e0e5ec"/>
      <text x="975" y="158" font-size="12" font-weight="800" fill="#101828" text-anchor="middle" letter-spacing="1">JORDAN AVERY</text>
      <rect x="922" y="166" width="106" height="4" rx="2" fill="#dfe4ec"/>
      <line x1="912" y1="178" x2="1038" y2="178" stroke="#0866FF" stroke-width="1"/>
      <!-- body lines -->
      <g fill="#d3d9e2">
        <rect x="912" y="186" width="126" height="4" rx="2"/>
        <rect x="912" y="195" width="112" height="4" rx="2"/>
        <rect x="912" y="204" width="120" height="4" rx="2"/>
        <rect x="912" y="216" width="70" height="4" rx="2" fill="#b9c0cc"/>
        <rect x="912" y="225" width="126" height="4" rx="2"/>
        <rect x="912" y="234" width="104" height="4" rx="2"/>
        <rect x="912" y="243" width="118" height="4" rx="2"/>
        <rect x="912" y="255" width="60" height="4" rx="2" fill="#b9c0cc"/>
        <rect x="912" y="264" width="122" height="4" rx="2"/>
        <rect x="912" y="273" width="110" height="4" rx="2"/>
        <rect x="912" y="282" width="126" height="4" rx="2"/>
        <rect x="912" y="291" width="98" height="4" rx="2"/>
        <rect x="912" y="300" width="116" height="4" rx="2"/>
        <rect x="912" y="309" width="106" height="4" rx="2"/>
        <rect x="912" y="318" width="122" height="4" rx="2"/>
      </g>
      <!-- the overflow bullet growing in red -->
      <rect class="ol" x="912" y="329" width="120" height="4" rx="2" fill="#e0473e"/>
    </g>

    <!-- preview: page 2 (slides in, red-dashed = rejected) -->
    <g class="p2">
      <rect x="1066" y="132" width="150" height="212" rx="4" fill="#fffafa" stroke="#e0473e" stroke-width="1.4" stroke-dasharray="5 4"/>
      <rect x="1082" y="150" width="70" height="4" rx="2" fill="#f0b8b4"/>
      <circle cx="1141" cy="264" r="16" fill="#fdeceb"/>
      <text x="1141" y="270" font-size="18" font-weight="800" fill="#c0362f" text-anchor="middle">2</text>
    </g>
  </g>
</svg>
