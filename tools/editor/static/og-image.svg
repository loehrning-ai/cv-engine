<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CV Copilot — your AI-native résumé copilot. One page, or the build fails.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0866FF"/>
      <stop offset="1" stop-color="#3b8bff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#0b1a3a" flood-opacity="0.14"/>
    </filter>
    <style>text{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="9" fill="url(#accent)"/>

  <!-- page mark -->
  <g transform="translate(80,86)">
    <rect x="0" y="0" width="56" height="70" rx="9" fill="#0866FF"/>
    <path d="M38 0 H56 V18 Z" fill="#0a4fc0"/>
    <rect x="12" y="20" width="26" height="5" rx="2.5" fill="#fff"/>
    <rect x="12" y="34" width="33" height="5" rx="2.5" fill="#fff" opacity="0.9"/>
    <rect x="12" y="48" width="21" height="5" rx="2.5" fill="#fff" opacity="0.75"/>
  </g>
  <text x="156" y="132" font-size="52" font-weight="800" fill="#0f1729" letter-spacing="-1.5">CV Copilot</text>
  <text x="158" y="166" font-size="23" font-weight="600" fill="#5b6472">Your AI-native résumé copilot.</text>

  <text x="80" y="300" font-size="76" font-weight="800" fill="#0f1729" letter-spacing="-2.5">One page.</text>
  <text x="80" y="392" font-size="76" font-weight="800" fill="#0866FF" letter-spacing="-2.5">Or the build fails.</text>

  <text x="80" y="470" font-size="27" fill="#4b5563">Import with Claude · tailor to the job · cover letters · ATS · BYO key</text>

  <!-- green 1-page pill -->
  <g transform="translate(80,510)">
    <rect x="0" y="0" width="150" height="44" rx="22" fill="#e7f8ee" stroke="#8fdcae" stroke-width="1.5"/>
    <circle cx="30" cy="22" r="9" fill="#22a95b"/>
    <path d="M26 22 l3 3.2 l6-6.4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="50" y="30" font-size="20" font-weight="700" fill="#177d43">1 page</text>
  </g>

  <!-- footer tie -->
  <rect x="80" y="586" width="7" height="7" fill="#B73A15"/>
  <rect x="91" y="586" width="7" height="7" fill="#B73A15"/>
  <text x="108" y="595" font-size="19" font-weight="600" fill="#8a929e">by loehrning.ai · open source · MIT</text>

  <!-- A4 preview card -->
  <g filter="url(#soft)" transform="translate(852,150)">
    <rect x="0" y="0" width="268" height="360" rx="12" fill="#ffffff" stroke="#e0e5ec"/>
    <text x="134" y="52" font-size="20" font-weight="800" fill="#101828" text-anchor="middle" letter-spacing="1.5">JORDAN AVERY</text>
    <rect x="70" y="66" width="128" height="6" rx="3" fill="#dfe4ec"/>
    <line x1="28" y1="88" x2="240" y2="88" stroke="#0866FF" stroke-width="1.5"/>
    <g fill="#d3d9e2">
      <rect x="28" y="104" width="210" height="6" rx="3"/>
      <rect x="28" y="118" width="186" height="6" rx="3"/>
      <rect x="28" y="132" width="200" height="6" rx="3"/>
      <rect x="28" y="152" width="96" height="6" rx="3" fill="#b9c0cc"/>
      <rect x="28" y="166" width="210" height="6" rx="3"/>
      <rect x="28" y="180" width="172" height="6" rx="3"/>
      <rect x="28" y="194" width="196" height="6" rx="3"/>
      <rect x="28" y="214" width="80" height="6" rx="3" fill="#b9c0cc"/>
      <rect x="28" y="228" width="204" height="6" rx="3"/>
      <rect x="28" y="242" width="182" height="6" rx="3"/>
      <rect x="28" y="256" width="210" height="6" rx="3"/>
      <rect x="28" y="270" width="160" height="6" rx="3"/>
      <rect x="28" y="290" width="90" height="6" rx="3" fill="#b9c0cc"/>
      <rect x="28" y="304" width="200" height="6" rx="3"/>
      <rect x="28" y="318" width="176" height="6" rx="3"/>
    </g>
  </g>
</svg>
